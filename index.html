<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arven Premium Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f6f8fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(560px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 40px #00000012}
.logo{text-align:center}.logo img{width:72px;height:72px;border-radius:18px}.muted{color:#64748b;font-size:.86rem;line-height:1.5}
h1{font-size:1.35rem;margin:12px 0 4px;text-align:center}.field{margin-top:15px}.field label{display:block;font-weight:700;font-size:.85rem;margin-bottom:7px}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:9px;padding:11px;font-weight:800;cursor:pointer;margin-top:15px}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2f7;color:#172033}
#generator{display:none}.status{margin-top:14px;padding:12px;border-radius:10px;background:#f1f5f9;font-size:.85rem;white-space:pre-wrap}
.code{font-size:1.2rem;font-weight:800;letter-spacing:1px;word-break:break-all}.danger{color:#b91c1c}.success{color:#047857}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="https://res.cloudinary.com/dgdaqwfib/image/upload/v1789358733/file_000000000214823095ab2b71e10e1990_cyerjd.png" alt="Arven"></div>
  <h1>Arven Premium Code Generator</h1>
  <p class="muted" style="text-align:center">Private generator. The backend independently requires the authorized account email and generator secret.</p>

  <div id="login">
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <div class="field"><label>Generator secret</label><input id="secret" type="password" autocomplete="off"></div>
    <button class="btn primary" id="loginBtn">Sign in</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="generator">
    <div class="status">Signed in as <strong id="who"></strong>. Only the backend can decide whether this account and generator secret are authorized.</div>
    <div class="field"><label>Custom code (optional)</label><input id="code" maxlength="128" placeholder="Leave blank to generate one"></div>
    <div class="field"><label>Redeem-code expiry</label><input id="expiresAt" type="datetime-local"></div>
    <div class="field"><label>Premium duration</label><div class="row"><input id="duration" type="number" min="1" step="1" value="30"><select id="unit"><option value="1000">Seconds</option><option value="60000">Minutes</option><option value="3600000">Hours</option><option value="86400000">Days</option><option value="604800000">Weeks</option><option value="2592000000">Months (30 days)</option><option value="315360000">Years (365 days)</option></select></div></div>
    <button class="btn primary" id="createBtn">Create one-time redeem code</button>
    <button class="btn secondary" id="logoutBtn">Sign out</button>
    <div id="result" class="status"></div>
  </div>
</div>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAqzMX2aMJC9vPTKkGZhL5i3Bjemd0aa9E",
 authDomain:"arvenai.firebaseapp.com",
 projectId:"arvenai",
 storageBucket:"arvenai.firebasestorage.app",
 messagingSenderId:"839108518515",
 appId:"1:839108518515:web:1f7f061959569cbed94006"
};
const BACKEND="https://arven-backend-m6ft.onrender.com";
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const $=id=>document.getElementById(id);
let generatorSecret="";
function status(msg,cls=""){$("loginStatus").textContent=msg;$("loginStatus").className="status "+cls}
function generatorStatus(msg,cls=""){$("result").textContent=msg;$("result").className="status "+cls}
$("loginBtn").onclick=async()=>{
  generatorSecret=$("secret").value;
  if(!generatorSecret){status("Enter the generator secret.","danger");return}
  try{
    const cred=await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);
    const email=(cred.user.email||"").toLowerCase();
    if(email!=="prathameshsingh5@gmail.com"){await auth.signOut();status("This generator is restricted to the authorized account.","danger");return}
  }catch(e){status(e.message||"Sign-in failed.","danger")}
};
auth.onAuthStateChanged(async user=>{
  if(user && (user.email||"").toLowerCase()==="prathameshsingh5@gmail.com"){
    $("login").style.display="none";$("generator").style.display="block";$("who").textContent=user.email;
  }else{
    $("login").style.display="block";$("generator").style.display="none";
  }
});
$("createBtn").onclick=async()=>{
  const user=auth.currentUser;
  if(!user){generatorStatus("Sign in first.","danger");return}
  const duration=Number($("duration").value), multiplier=Number($("unit").value);
  const expiresAt=new Date($("expiresAt").value).getTime();
  const durationMs=duration*multiplier;
  if(!Number.isFinite(expiresAt)||expiresAt<=Date.now()){generatorStatus("Choose a future redeem-code expiry.","danger");return}
  if(!Number.isSafeInteger(durationMs)||durationMs<1000){generatorStatus("Enter a valid Premium duration.","danger");return}
  $("createBtn").disabled=true;
  try{
    const token=await user.getIdToken();
    const r=await fetch(BACKEND+"/premium/generator/create",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"X-Arven-Premium-Generator":generatorSecret,"X-Arven-Premium-Generator-App":"ArvenPremiumCodeGeneratorV1"},
      body:JSON.stringify({code:$("code").value.trim(),expiresAt:new Date(expiresAt).toISOString(),durationMs})
    });
    let data={};try{data=await r.json()}catch(_){}
    if(!r.ok)throw new Error(data.message||data.error||"Code generation failed.");
    generatorStatus("CODE: "+data.code+"\nDuration: "+data.durationLabel+"\nRedeem-code expiry: "+new Date(data.expiresAt).toLocaleString()+"\nOne-time use: yes","success");
    $("code").value="";
  }catch(e){generatorStatus(e.message||"Code generation failed.","danger")}
  finally{$("createBtn").disabled=false}
};
$("logoutBtn").onclick=()=>auth.signOut();
</script>
</body>
</html>
